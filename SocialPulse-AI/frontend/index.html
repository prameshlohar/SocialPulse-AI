@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.copy-btn{background:transparent;border:1px solid #252d3d;border-radius:6px;color:#8b929e;padding:4px 10px;font-size:12px;cursor:pointer;transition:all .2s}

// ── API Helper ────────────────────────────────────────────────────────────────
async function apiFetch(path, opts = {}) {
  const res = await fetch(API_BASE + path, {
    headers: { "Content-Type": "application/json" },
    ...opts,
  });
  if (!res.ok) {
    // Try to extract JSON error message from body
    try {
      const j = await res.json();
      throw new Error(j.error || ("API " + res.status));
    } catch(e) {
      if (e.message && !e.message.startsWith("API ")) throw e;
      throw new Error("API " + res.status);
    }
  }
  return res.json();
}

// ── Shared UI Components ──────────────────────────────────────────────────────
function Spinner() {
  return React.createElement("div", { className: "spinner" });
}

function DemoTag() {
  return React.createElement("span", { className: "badge-demo" }, "\u26A1 Demo AI Mode");
}

function CopyBtn({ text }) {
  const [copied, setCopied] = useState(false);
  const doCopy = () => {
    if (!text) return;
    try {
      navigator.clipboard.writeText(text).then(() => {
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      }).catch(() => {
        const ta = document.createElement("textarea");
        ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand("copy"); document.body.removeChild(ta);
        setCopied(true); setTimeout(() => setCopied(false), 2000);
      });
    } catch(e) {}
  };
  return <button className="copy-btn" onClick={doCopy}>{copied ? "✓ Copied" : "⎘ Copy"}</button>;
}

function PlatformBadge({ p }) {
  const c = {Instagram:"badge-purple",YouTube:"badge-red",LinkedIn:"badge-blue",
              Facebook:"badge-blue",X:"badge-yellow","X (Twitter)":"badge-yellow",TikTok:"badge-green"};
  return <span className={`badge ${c[p] || "badge-blue"}`}>{p}</span>;
}

function ChartTip({ active, payload, label }) {
  if (!active || !payload || !payload.length) return null;
  return (
    <div style={{background:"#1c2333",border:"1px solid #252d3d",borderRadius:8,padding:"10px 14px",fontSize:12}}>
      <p style={{color:"#8b929e",marginBottom:4}}>{label}</p>
      {payload.map((p, i) => <p key={i} style={{color:p.color}}>{p.name}: {typeof p.value === "number" ? p.value.toLocaleString() : p.value}</p>)}
    </div>
  );
}

// ── DASHBOARD ─────────────────────────────────────────────────────────────────

        <div className="card" style={{minWidth:0}}>

          <ResponsiveContainer width="100%" height={220}>

      </div>

      {/* Posts + Hashtags */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 320px",gap:16}}>
        <div className="card" style={{minWidth:0}}>
          <h3 style={{fontWeight:600,color:"#fff",marginBottom:16}}>Recent Post Performance</h3>
          <div className="table-wrap">

// ── TREND RADAR ───────────────────────────────────────────────────────────────
function TrendRadar() {
  const [trends, setTrends] = useState(FALLBACK_TRENDS);
  const [loading, setLoading] = useState(true);
  const [selected, setSelected] = useState(null);
  const [filter, setFilter] = useState("all");

  useEffect(() => {
    apiFetch("/trends")
      .then(d => { setTrends(d.trends || FALLBACK_TRENDS); setLoading(false); })
      .catch(() => setLoading(false));
  }, []);

  const niches = ["all", ...Array.from(new Set(trends.map(t => t.niche.split(" / ")[0])))];
  const filtered = filter === "all" ? trends : trends.filter(t => t.niche.includes(filter));
  const momColor = m => m>=90?"#10b981":m>=75?"#3b82f6":m>=60?"#f59e0b":"#ef4444";

  return (
    <div className="fade-in" style={{display:"flex",flexDirection:"column",gap:24}}>
      <div style={{display:"flex",flexWrap:"wrap",alignItems:"center",justifyContent:"space-between",gap:12}}>
        <div>
          <h1 style={{fontSize:22,fontWeight:700,color:"#fff"}}>Trend Radar</h1>
          <p style={{fontSize:13,color:"#8b929e",marginTop:4}}>Simulated trend data — updated weekly</p>
        </div>
        <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
          {niches.map(n=>(
            <button key={n} className={`platform-filter ${filter===n?"active":""}`} onClick={()=>setFilter(n)}>
              {n==="all"?"All Niches":n}
            </button>
          ))}
        </div>
      </div>

      {loading ? (
        <div style={{display:"flex",justifyContent:"center",padding:"60px 0"}}><Spinner/></div>
      ) : (
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:16}}>
          {filtered.map((t,i)=>(
            <div key={i} className="trend-card" onClick={()=>setSelected(selected===t?null:t)}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
                <h3 style={{fontWeight:600,color:"#fff",fontSize:14}}>{t.name}</h3>
                <span className="badge badge-green">{t.growth}</span>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                <span style={{fontSize:11,color:"#8b929e",flexShrink:0}}>Momentum</span>
                <div className="progress-bar" style={{flex:1}}>
                  <div className="progress-fill" style={{width:`${t.momentum}%`,background:momColor(t.momentum)}}/>
                </div>

const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const CPLATFORMS = ["Instagram","YouTube","LinkedIn","Facebook","X","TikTok"];
const STATUSES = ["Idea","Planned","Published"];
const SCOL = {Idea:"#f59e0b",Planned:"#3b82f6",Published:"#10b981"};

function ContentCalendar() {
  const [posts, setPosts] = useState(() => {
    try { return JSON.parse(localStorage.getItem("sp_calendar") || "[]"); } catch { return []; }
  });
  const [modal, setModal] = useState(null);
  const [form, setForm] = useState({day:"Monday",platform:"Instagram",topic:"",status:"Idea"});

  const savePosts = updated => {
    setPosts(updated);
    try { localStorage.setItem("sp_calendar", JSON.stringify(updated)); } catch(e){}
  };

  const save = () => {
    if (!form.topic.trim()) return;
    const updated = modal && modal.id
      ? posts.map(p => p.id === modal.id ? {...form, id:modal.id} : p)
      : [...posts, {...form, id: Date.now()}];
    savePosts(updated);
    setModal(null);
    setForm({day:"Monday",platform:"Instagram",topic:"",status:"Idea"});
  };

  const remove = id => savePosts(posts.filter(p => p.id !== id));

  const cycleStatus = id => savePosts(posts.map(p => {
    if (p.id !== id) return p;
    return {...p, status: STATUSES[(STATUSES.indexOf(p.status)+1) % STATUSES.length]};
  }));

  return (
    <div className="fade-in" style={{display:"flex",flexDirection:"column",gap:24}}>

      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:8}}>
        {DAYS.map(day=>{
          const dayPosts = posts.filter(p=>p.day===day);
          return (
            <div key={day} className="cal-slot">
              <div style={{fontSize:11,fontWeight:600,color:"#10b981",marginBottom:6}}>

              {dayPosts.map(p=>(
                <div key={p.id} className="cal-post" style={{background:`${SCOL[p.status]}18`,border:`1px solid ${SCOL[p.status]}40`}}>
                  <div style={{display:"flex",alignItems:"flex-start",gap:3}}>
                    <span style={{cursor:"pointer",flexShrink:0,marginTop:1}} onClick={()=>cycleStatus(p.id)} title="Cycle status">
                      <span style={{display:"inline-block",width:7,height:7,borderRadius:"50%",background:SCOL[p.status]}}/>
                    </span>
                    <span style={{cursor:"pointer",color:"#c9d1d9",flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}
                      title={p.topic} onClick={()=>{setForm({...p});setModal(p);}}>
                      {p.topic}
                    </span>
                    <span style={{cursor:"pointer",color:"#ef4444",fontSize:10,flexShrink:0}} onClick={()=>remove(p.id)}>✕</span>
                  </div>
                  <div style={{fontSize:10,color:"#8b929e",marginTop:2}}>{p.platform}</div>
                </div>
              ))}
            </div>
          );
        })}
      </div>

      {posts.length > 0 && (

// ── YOUTUBE CHANNEL ANALYZER ─────────────────────────────────────────────────
function fmtNum(n) {
  if (n == null) return "Hidden";
  if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";
  return n.toLocaleString();
}
function fmtDate(iso) {
  if (!iso) return "—";
  return new Date(iso).toLocaleDateString("en-US", {year:"numeric",month:"short",day:"numeric"});
}
function parseDur(iso) {
  if (!iso) return "";
  const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  if (!m) return iso;
  const h = parseInt(m[1]||0), mi = parseInt(m[2]||0), s = parseInt(m[3]||0);
  if (h) return `${h}:${String(mi).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  return `${mi}:${String(s).padStart(2,"0")}`;
}

const CURRENCIES = [
  {code:"USD", symbol:"$",  rate:1},
  {code:"INR", symbol:"₹",  rate:84},
  {code:"EUR", symbol:"€",  rate:0.92},
  {code:"GBP", symbol:"£",  rate:0.79},
];

function YouTubeAnalyzer() {
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError] = useState(null);
  const [currency, setCurrency] = useState("USD");
  const [rpmLong, setRpmLong] = useState(2.5);
  const [rpmShort, setRpmShort] = useState(0.05);
  const [videoTypes, setVideoTypes] = useState({});

  const analyze = async () => {
    if (!input.trim()) return;
    setLoading(true); setError(null); setResult(null); setVideoTypes({});
    try {
      const r = await apiFetch("/youtube/analyze", {method:"POST", body:JSON.stringify({channel_input:input.trim()})});
      setResult(r);
      // seed type overrides from API classification
      const types = {};
      (r.videos||[]).forEach(v => { types[v.id] = v.type; });
      setVideoTypes(types);
    } catch(e) {
      setError(e.message || "Unknown error");
    }
    setLoading(false);
  };

  const toggleType = id => setVideoTypes(t => ({...t, [id]: t[id]==="short"?"long":"short"}));

  const cur = CURRENCIES.find(c=>c.code===currency)||CURRENCIES[0];

  // Revenue calc
  const revenues = (result?.videos||[]).map(v => {
    const t = videoTypes[v.id] || v.type;
    const rpm = t === "short" ? rpmShort : rpmLong;
    return { id:v.id, est: (v.views / 1000) * rpm };
  });
  const totalEst = revenues.reduce((s,r)=>s+r.est, 0) * cur.rate;
  const revMap = Object.fromEntries(revenues.map(r=>[r.id, r.est * cur.rate]));

  // Chart data: top 10 by views
  const chartData = [...(result?.videos||[])]
    .sort((a,b)=>b.views-a.views)
    .slice(0,10)
    .map(v=>({name: v.title.length>28 ? v.title.slice(0,25)+"…" : v.title, views: v.views, likes: v.likes}));

  const ch = result?.channel;

  return (
    <div className="fade-in" style={{display:"flex",flexDirection:"column",gap:24}}>
      {/* Header */}
      <div>
        <h1 style={{fontSize:22,fontWeight:700,color:"#fff"}}>YouTube Channel Analyzer</h1>
        <p style={{fontSize:13,color:"#8b929e",marginTop:4}}>
          Paste any channel URL, @handle or channel ID — uses YouTube Data API v3
        </p>
      </div>

      {/* Input */}
      <div className="card" style={{display:"flex",gap:10,alignItems:"flex-start",flexWrap:"wrap"}}>
        <div style={{flex:"1 1 340px"}}>
          <input type="text" className="input"
            placeholder="e.g. @MrBeast  or  youtube.com/@veritasium  or  UCxxxxxx"
            value={input} onChange={e=>setInput(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&analyze()}
            style={{fontSize:14}}/>
        </div>
        <button className="btn-primary" onClick={analyze} disabled={loading||!input.trim()}>
          {loading ? <><Spinner/>&nbsp;Analyzing…</> : "🔍 Analyze Channel"}
        </button>
        {result && (
          <button className="btn-secondary" onClick={()=>{setResult(null);setError(null);setInput("");}}>
            New Search
          </button>
        )}
      </div>

      {error && (
        <div style={{background:"rgba(239,68,68,.1)",border:"1px solid rgba(239,68,68,.3)",borderRadius:10,padding:"14px 18px",color:"#fca5a5",fontSize:14}}>
          ❌ {error}
          {error.includes("quota") && <div style={{marginTop:6,fontSize:12,color:"#8b929e"}}>YouTube API free quota resets daily at midnight Pacific Time.</div>}
          {error.includes("YOUTUBE_API_KEY") && (
            <div style={{marginTop:6,fontSize:12,color:"#8b929e"}}>
              Add <code style={{color:"#f59e0b"}}>YOUTUBE_API_KEY=your_key</code> to <code style={{color:"#f59e0b"}}>backend/.env</code> and restart Flask.
            </div>
          )}
        </div>
      )}

      {result && ch && (
        <>
          {/* Channel card */}
          <div className="card" style={{display:"flex",gap:20,alignItems:"flex-start",flexWrap:"wrap"}}>
            {ch.avatar && (
              <img src={ch.avatar} alt={ch.name} style={{width:80,height:80,borderRadius:"50%",border:"2px solid #252d3d",flexShrink:0}}/>
            )}
            <div style={{flex:1,minWidth:200}}>
              <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
                <h2 style={{fontSize:20,fontWeight:700,color:"#fff"}}>{ch.name}</h2>
                {ch.country && <span className="badge badge-blue">{ch.country}</span>}
                <a href={ch.url} target="_blank" rel="noopener" style={{color:"#10b981",fontSize:12,textDecoration:"none"}}>↗ Open Channel</a>
              </div>
              <p style={{fontSize:12,color:"#8b929e",marginTop:4}}>Joined {fmtDate(ch.published_at)}</p>
              {ch.description && (
                <p style={{fontSize:13,color:"#8b929e",marginTop:8,lineHeight:1.6,maxWidth:600,
                  overflow:"hidden",display:"-webkit-box",WebkitLineClamp:3,WebkitBoxOrient:"vertical"}}>
                  {ch.description}
                </p>
              )}
            </div>
          </div>

          {/* KPI row */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(170px,1fr))",gap:14}}>
            {[
              {label:"Subscribers",   val: ch.hidden_subs ? "Hidden" : fmtNum(ch.subscribers), icon:"👥", color:"#10b981"},
              {label:"Total Views",   val: fmtNum(ch.total_views),  icon:"👁️", color:"#3b82f6"},
              {label:"Videos",        val: fmtNum(ch.video_count),  icon:"🎬", color:"#8b5cf6"},
              {label:"Fetched Views", val: fmtNum((result.videos||[]).reduce((s,v)=>s+v.views,0)), icon:"📊", color:"#f59e0b"},
            ].map(k=>(
              <div key={k.label} className="kpi-card">
                <div style={{fontSize:22,marginBottom:4}}>{k.icon}</div>
                <div style={{fontSize:22,fontWeight:700,color:k.color}}>{k.val}</div>
                <div style={{fontSize:12,color:"#8b929e",marginTop:4}}>{k.label}</div>
              </div>
            ))}
          </div>

          {/* RPM + Revenue panel */}
          <div className="card">
            <div style={{display:"flex",flexWrap:"wrap",alignItems:"center",justifyContent:"space-between",gap:10,marginBottom:16}}>
              <div>
                <h3 style={{fontWeight:600,color:"#fff"}}>📐 Estimated Revenue Calculator</h3>
                <p style={{fontSize:12,color:"#8b929e",marginTop:3}}>
                  Hypothetical estimates only — not actual earnings. RPM = Revenue Per Mille (1,000 views).
                </p>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <label style={{fontSize:12,color:"#8b929e"}}>Currency</label>
                <select className="select" value={currency} onChange={e=>setCurrency(e.target.value)} style={{width:90}}>
                  {CURRENCIES.map(c=><option key={c.code} value={c.code}>{c.code} ({c.symbol})</option>)}
                </select>
              </div>
            </div>

            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:14,marginBottom:20}}>
              <div>
                <label style={{display:"block",fontSize:12,color:"#8b929e",marginBottom:5}}>
                  Long-form RPM ({cur.symbol} per 1K views)
                </label>
                <input type="number" className="input" min="0" step="0.5"
                  value={rpmLong} onChange={e=>setRpmLong(parseFloat(e.target.value)||0)}/>
                <p style={{fontSize:11,color:"#374151",marginTop:3}}>Typical range: $1–$10 USD</p>
              </div>
              <div>
                <label style={{display:"block",fontSize:12,color:"#8b929e",marginBottom:5}}>
                  Shorts RPM ({cur.symbol} per 1K views)
                </label>
                <input type="number" className="input" min="0" step="0.01"
                  value={rpmShort} onChange={e=>setRpmShort(parseFloat(e.target.value)||0)}/>
                <p style={{fontSize:11,color:"#374151",marginTop:3}}>Typical range: $0.03–$0.07 USD</p>
              </div>
              <div className="kpi-card" style={{display:"flex",flexDirection:"column",justifyContent:"center"}}>
                <div style={{fontSize:11,color:"#8b929e",marginBottom:4}}>Estimated earnings (20 videos)</div>
                <div style={{fontSize:26,fontWeight:700,color:"#10b981"}}>
                  {cur.symbol}{totalEst.toLocaleString("en-US",{maximumFractionDigits:0})}
                </div>
                <div style={{fontSize:11,color:"#374151",marginTop:4}}>
                  ⚠️ Estimate only — not actual revenue
                </div>
              </div>
            </div>
          </div>

          {/* Top videos chart */}
          {chartData.length > 0 && (
            <div className="card">
              <h3 style={{fontWeight:600,color:"#fff",marginBottom:16}}>Top 10 Videos by Views</h3>
              <ResponsiveContainer width="100%" height={220}>
                <BarChart data={chartData} layout="vertical" margin={{left:10,right:40,top:4,bottom:4}}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#252d3d" horizontal={false}/>
                  <XAxis type="number" stroke="#8b929e" tick={{fontSize:10}} tickLine={false} tickFormatter={v=>fmtNum(v)}/>
                  <YAxis type="category" dataKey="name" stroke="#8b929e" tick={{fontSize:10}} tickLine={false} width={160}/>
                  <Tooltip contentStyle={{background:"#1c2333",border:"1px solid #252d3d",borderRadius:8,fontSize:12}}
                    formatter={(v,n)=>[fmtNum(v),n]}/>
                  <Bar dataKey="views" fill="#10b981" radius={[0,4,4,0]} name="Views"/>
                  <Bar dataKey="likes" fill="#3b82f6" radius={[0,4,4,0]} name="Likes"/>
                </BarChart>
              </ResponsiveContainer>
            </div>
          )}

          {/* Video table */}
          {(result.videos||[]).length > 0 && (
            <div className="card">
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8}}>
                <h3 style={{fontWeight:600,color:"#fff"}}>Recent Videos ({result.videos.length})</h3>
                <p style={{fontSize:12,color:"#8b929e"}}>Click Short/Long to toggle classification for revenue estimate</p>
              </div>
              <div className="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th style={{width:60}}>Thumb</th>
                      <th>Title</th>
                      <th>Published</th>
                      <th>Duration</th>
                      <th>Views</th>
                      <th>Likes</th>
                      <th>Eng%</th>
                      <th>Type</th>
                      <th>Est. {cur.symbol}</th>
                    </tr>
                  </thead>
                  <tbody>
                    {(result.videos||[]).map(v=>{
                      const t = videoTypes[v.id]||v.type;
                      return (
                        <tr key={v.id}>
                          <td>
                            <a href={v.url} target="_blank" rel="noopener">
                              {v.thumbnail
                                ? <img src={v.thumbnail} alt="" style={{width:56,height:36,borderRadius:4,objectFit:"cover",display:"block"}}/>
                                : <div style={{width:56,height:36,background:"#252d3d",borderRadius:4,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>🎬</div>
                              }
                            </a>
                          </td>
                          <td style={{maxWidth:260}}>
                            <a href={v.url} target="_blank" rel="noopener"
                              style={{color:"#c9d1d9",textDecoration:"none",fontSize:12,display:"block",
                                overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}
                              title={v.title}>{v.title}</a>
                          </td>
                          <td style={{color:"#8b929e",fontSize:12,whiteSpace:"nowrap"}}>{fmtDate(v.published_at)}</td>
                          <td style={{color:"#8b929e",fontSize:12,whiteSpace:"nowrap"}}>{parseDur(v.duration)}</td>
                          <td style={{color:"#fff",fontWeight:600}}>{fmtNum(v.views)}</td>
                          <td style={{color:"#fff"}}>{fmtNum(v.likes)}</td>
                          <td>
                            <span style={{color: v.engagement>5?"#10b981":v.engagement>2?"#f59e0b":"#8b929e", fontWeight:600, fontSize:12}}>
                              {v.engagement}%
                            </span>
                          </td>
                          <td>
                            <button onClick={()=>toggleType(v.id)}
                              className={`badge ${t==="short"?"badge-purple":"badge-blue"}`}
                              style={{cursor:"pointer",border:"none",fontSize:11}}>
                              {t==="short"?"Short":"Long"}
                            </button>
                          </td>
                          <td style={{color:"#10b981",fontWeight:600,fontSize:12,whiteSpace:"nowrap"}}>
                            {cur.symbol}{(revMap[v.id]||0).toLocaleString("en-US",{maximumFractionDigits:0})}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
              <p style={{fontSize:11,color:"#374151",marginTop:10}}>
                * Revenue estimates are based on configurable RPM assumptions and are purely hypothetical. Actual YouTube earnings depend on ad types, audience geography, CPM auctions, monetization eligibility and many other factors. This tool uses only public YouTube Data API v3 data.
              </p>
            </div>
          )}
        </>
      )}
    </div>
  );
}

// ── ROOT APP ──────────────────────────────────────────────────────────────────
const NAV = [
  {id:"dashboard",   label:"Dashboard",         icon:"📊"},
  {id:"youtube",     label:"YT Channel Analyzer",icon:"▶️"},
  {id:"content",     label:"AI Content Studio", icon:"✍️"},
  {id:"trends",      label:"Trend Radar",        icon:"📈"},
  {id:"audience",    label:"Audience Insights",  icon:"👥"},
  {id:"competitors", label:"Competitor Intel",   icon:"🔍"},
  {id:"calendar",    label:"Content Calendar",   icon:"📅"},
  {id:"sentiment",   label:"Sentiment Analyzer", icon:"😊"},
  {id:"strategy",    label:"AI Strategy Agent",  icon:"⚡"},
  {id:"settings",    label:"Settings",           icon:"⚙️"},
];

function App() {
  const [page, setPage] = useState("dashboard");
  const [sidebarOpen, setSidebarOpen] = useState(true);

  const renderPage = () => {
    switch(page) {
      case "dashboard":   return <Dashboard/>;
      case "youtube":     return <YouTubeAnalyzer/>;
      case "strategy":    return <StrategyAgent/>;
      case "content":     return <ContentStudio/>;
      case "sentiment":   return <SentimentAnalyzer/>;
      case "trends":      return <TrendRadar/>;
      case "competitors": return <CompetitorIntelligence/>;
      case "audience":    return <AudienceInsights/>;
      case "calendar":    return <ContentCalendar/>;
      case "settings":    return <Settings/>;
      default:            return <Dashboard/>;
    }
  };

  return (
    <div style={{display:"flex",height:"100vh",overflow:"hidden",background:"#0f1117"}}>
      {/* Sidebar */}
      <div style={{
        width: sidebarOpen ? 220 : 0,
        minWidth: sidebarOpen ? 220 : 0,
        background:"#161b27",
        borderRight:"1px solid #252d3d",
        display:"flex",
        flexDirection:"column",
        transition:"width .25s ease, min-width .25s ease",
        overflow:"hidden",
        flexShrink:0,
      }}>
        <div style={{padding:"20px 16px 16px",borderBottom:"1px solid #252d3d",flexShrink:0}}>
          <div className="logo-text">SocialPulse AI</div>
          <div style={{fontSize:10,color:"#8b929e",marginTop:2}}>Social Intelligence Platform</div>
        </div>

        <nav style={{flex:1,padding:"10px 8px",overflowY:"auto"}}>
          {NAV.map(item=>(
            <div key={item.id} className={`sidebar-link ${page===item.id?"active":""}`} onClick={()=>setPage(item.id)}>
              <span style={{fontSize:15,flexShrink:0}}>{item.icon}</span>
              <span style={{whiteSpace:"nowrap"}}>{item.label}</span>
            </div>
          ))}
        </nav>

        <div style={{padding:"12px",borderTop:"1px solid #252d3d",flexShrink:0}}>
          <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 8px",borderRadius:8,background:"#1c2333",border:"1px solid #252d3d"}}>
            <div style={{width:32,height:32,borderRadius:"50%",background:"linear-gradient(135deg,#10b981,#3b82f6)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:700,color:"#fff",flexShrink:0}}>C</div>
            <div>
              <div style={{fontSize:13,fontWeight:600,color:"#e6edf3",whiteSpace:"nowrap"}}>Creator Pro</div>
              <div style={{fontSize:11,color:"#8b929e"}}>Pro Plan</div>
            </div>
          </div>
        </div>
      </div>

      {/* Main area */}
      <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",minWidth:0}}>
        {/* Top bar */}
        <div style={{background:"#161b27",borderBottom:"1px solid #252d3d",padding:"12px 20px",display:"flex",alignItems:"center",gap:12,flexShrink:0}}>
          <button onClick={()=>setSidebarOpen(o=>!o)}
            style={{background:"transparent",border:"none",color:"#8b929e",cursor:"pointer",padding:"4px",borderRadius:6,fontSize:18,lineHeight:1,display:"flex",alignItems:"center"}}>
            ☰
          </button>
          <span style={{fontSize:14,fontWeight:600,color:"#e6edf3"}}>{(NAV.find(n=>n.id===page)||{}).icon} {(NAV.find(n=>n.id===page)||{}).label}</span>
          <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:8}}>
            <span className="badge badge-green" style={{fontSize:10}}>v1.0</span>
          </div>
        </div>

        {/* Page content */}
        <div style={{flex:1,overflowY:"auto",padding:"24px",minWidth:0}}>
          {renderPage()}
        </div>
      </div>
    </div>
  );
}

// ── Mount ─────────────────────────────────────────────────────────────────────
const rootEl = document.getElementById("root");
if (rootEl) {
  ReactDOM.createRoot(rootEl).render(React.createElement(App));
}
</script>
</body>
</html>
